name: Rova Application CI/CD

on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "main"

env:
  AWS_DEFAULT_REGION: eu-central-1
  ECR_REPOSITORY: rova-app-registry
  IMAGE_NAME: rova-app
  
jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: cd task-2-cicd/app && go mod tidy

      - name: Run tests
        run: cd task-2-cicd/app && go test -v ./...

    

  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -f task-2-cicd/Dockerfile \
            task-2-cicd/
      
      - name: Save Docker Image to Single File
        run: |
          docker save -o rova-app.tar \
          ${{ env.IMAGE_NAME }}:latest \
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
        

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rova-app-image
          path: rova-app.tar

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Docker Image from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: rova-app-image

      - name: Load Docker Image
        run: docker load -i rova-app.tar

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'table'
          ignore-unfixed: 'true'
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'

  deploy:
    runs-on: ubuntu-latest
    needs: scan
    if: github.event_name == 'push'
    steps:
      - name: Download Docker Image from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: rova-app-image

      - name: Load Docker Image
        run: docker load -i rova-app.tar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Tag and push Docker image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest

          docker tag \
            ${{ env.IMAGE_NAME }}:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
            
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_DEFAULT_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
